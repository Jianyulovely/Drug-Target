   <g id="text_1">
    <text style="fill: #26313a; font: 700 10.2px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="17.428" y="22.318281" transform="rotate(-0 17.428 22.318281)">Leakage-safe ArnoldiGCL with similarity-neighbour side information</text>
   </g>
   <g id="text_2">
    <text style="fill: #5f6b73; font: 6.9px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="17.428" y="30.905984" transform="rotate(-0 17.428 30.905984)">The drug and protein pathways remain separate; only training-fold evidence enters graph and side-information construction.</text>
   </g>
   <g id="text_3">
    <text style="fill: #26313a; font: 700 7.7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="54.5045" y="68.414523" transform="rotate(-0 54.5045 68.414523)">Drug input</text>
   </g>
   <g id="text_4">
